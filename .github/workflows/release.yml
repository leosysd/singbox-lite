name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0-r26
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zstd

      - name: Build APK
        run: bash scripts/build-apk.sh

      - name: Add stable asset name
        run: cp dist/luci-app-singbox-lite-*.apk dist/luci-app-singbox-lite.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: luci-app-singbox-lite-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="Automated release package for ${RELEASE_TAG}."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.apk --target "$GITHUB_SHA" --title "luci-app-singbox-lite ${RELEASE_TAG}" --notes "$notes"
          fi
